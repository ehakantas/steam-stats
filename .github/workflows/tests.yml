name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/tests.yml"]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests -v
