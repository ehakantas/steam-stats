name: steam-stats
on:
  schedule:
    - cron: "0 9,21 * * *"  # GitHub cron is always UTC: 12:00 and 00:00 TR
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY: ${{ secrets.STEAM_VANITY }}
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "update stats" && git push)
