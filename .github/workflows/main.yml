name: steam-stats
on:
  schedule:
    # Every 3rd day of the month (1, 4, 7, ... 28, 31), so the gap is 1-3 days at month ends.
    # GitHub cron is always UTC: 05:23 UTC = 08:23 TR (Istanbul, UTC+3); off-the-hour minute to avoid GitHub's top-of-hour delays
    - cron: "23 5 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY: ${{ secrets.STEAM_VANITY }}
      - name: Comment stats (best effort; must never block the main stats)
        continue-on-error: true
        run: python3 scripts/fetch_comments.py
      - name: WhatsApp notification (best effort; must never block the main stats)
        continue-on-error: true
        run: python3 scripts/notify_whatsapp.py
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json data/history.csv
          git add data/comments.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update stats" && git push)
      - name: Trigger Witcher 3 Workshop report (best effort; must never fail the run)
        continue-on-error: true
        env:
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: python3 scripts/trigger_report.py
